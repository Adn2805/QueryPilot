version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: querypilot-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-querypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-querypilot_password}
      POSTGRES_DB: ${POSTGRES_DB:-querypilot_app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-querypilot} -d ${POSTGRES_DB:-querypilot_app}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: querypilot-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: querypilot-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-querypilot}:${POSTGRES_PASSWORD:-querypilot_password}@postgres:5432/${POSTGRES_DB:-querypilot_app}
      - ANALYTICS_DATABASE_URL=postgresql+asyncpg://querypilot_readonly:readonly_password@postgres:5432/querypilot_analytics
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: querypilot-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:${BACKEND_PORT:-8000}
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
